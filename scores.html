<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สรุปคะแนนรายคน · ระบบส่งงานบ้านละลม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.21.0/tabler-icons.min.css">
<style>
  :root{--green:#5E9A2D;--green-d:#2F5511;--green-l:#EFF4E4;--yellow:#F7C948;--yellow-d:#6B4D06;--bg:#F4F8EC;--ink:#33421C;--muted:#6E7B56;--line:#D2DEBC;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--green);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
  .brand .lg{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:15px;font-weight:700;flex:none}
  .brand .lg img{width:100%;height:100%;object-fit:contain}
  .user{display:flex;align-items:center;gap:9px;font-size:13px}
  .btn-logout{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit;cursor:pointer}
  .btn-logout:hover{background:rgba(255,255,255,.28)}
  nav.nav{background:#fff;border-bottom:0.5px solid var(--line);display:flex;gap:2px;padding:0 10px;overflow-x:auto;white-space:nowrap}
  nav.nav a{display:inline-flex;align-items:center;gap:6px;padding:12px 13px;font-size:13px;color:var(--muted);text-decoration:none;border-bottom:2.5px solid transparent}
  nav.nav a i{font-size:16px}
  nav.nav a:hover{color:var(--green-d)} nav.nav a.active{color:var(--green-d);font-weight:600;border-bottom-color:var(--green)}
  main{flex:1;width:100%;max-width:840px;margin:0 auto;padding:16px}
  .back{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--green);text-decoration:none;margin-bottom:10px}
  .back:hover{color:var(--green-d)}
  h1{font-size:19px;font-weight:600;color:var(--green-d)} .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .picker{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select{height:42px;border:0.5px solid #CBD9B0;border-radius:10px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(94,154,45,.2)}
  .head-card{background:#fff;border:0.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .avatar{width:48px;height:48px;border-radius:50%;background:var(--green-l);color:var(--green-d);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
  .head-card .info{flex:1;min-width:0}
  .head-card .nm{font-size:17px;font-weight:600;color:var(--green-d)}
  .head-card .rm{font-size:13px;color:var(--muted);margin-top:2px}
  .totals{display:flex;gap:10px;flex-wrap:wrap}
  .tchip{background:var(--green-l);border-radius:10px;padding:8px 14px;text-align:center}
  .tchip b{display:block;font-size:20px;color:var(--green-d);font-weight:700}
  .tchip span{font-size:12px;color:var(--muted)}
  .panel{background:#fff;border:0.5px solid var(--line);border-radius:14px;margin-top:14px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
  th,td{text-align:left;padding:11px 14px;border-bottom:0.5px solid #EDF1E2}
  th{color:var(--muted);font-weight:600;font-size:12px;background:#FAFCF4} tr:last-child td{border-bottom:none}
  .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
  .p-ok{background:#DCEFC4;color:var(--green-d)} .p-late{background:#FBE6BD;color:var(--yellow-d)} .p-ck{background:#CFE8AE;color:var(--green-d)}
  .scorecell{font-weight:600;color:var(--green-d)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:30px 10px}
  .printbtn{margin-left:auto;background:var(--yellow);color:var(--yellow-d);border:none;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  footer{margin-top:18px;padding:14px 16px;border-top:0.5px solid var(--line);background:var(--green-l);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  footer b{color:var(--green-d);font-weight:600}
  @media print{header,nav.nav,.picker,.back,.printbtn,footer{display:none!important}body{background:#fff}main{padding:0;max-width:none}.panel{border:none}th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <style>
  /* ===== ตัวโหลดข้อมูล ธีมไซไฟ (พื้นหลังเบลอ + วงแหวน + โลโก้กลาง) ===== */
  .bl-ov{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:rgba(18,30,10,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .22s ease}
  .bl-ov.show{display:flex;opacity:1}
  .bl-ring{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
  .bl-ring svg{position:absolute;top:0;left:0;width:132px;height:132px}
  .bl-ring .r-out,.bl-ring .r-mid,.bl-ring .r-dot{transform-box:view-box;transform-origin:50% 50%}
  .bl-ring .r-out{animation:bl-cw 2.6s linear infinite}
  .bl-ring .r-mid{animation:bl-ccw 1.7s linear infinite}
  .bl-ring .r-dot{animation:bl-cw 1.1s linear infinite}
  @keyframes bl-cw{to{transform:rotate(360deg)}}
  @keyframes bl-ccw{to{transform:rotate(-360deg)}}
  .bl-core{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
    overflow:hidden;animation:bl-pulse 1.9s ease-in-out infinite}
  .bl-core img{width:78%;height:78%;object-fit:contain}
  @keyframes bl-pulse{0%,100%{box-shadow:0 0 20px rgba(94,154,45,.5)}50%{box-shadow:0 0 38px rgba(247,201,72,.62)}}
  .bl-text{color:#fff;font-family:'IBM Plex Sans Thai',sans-serif;font-size:14.5px;font-weight:500;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .bl-text small{display:block;font-size:11.5px;opacity:.78;font-weight:400;margin-top:4px}
  @media(prefers-reduced-motion:reduce){.bl-ring .r-out,.bl-ring .r-mid,.bl-ring .r-dot,.bl-core{animation:none}}
  .swal2-popup{font-family:'IBM Plex Sans Thai',sans-serif!important}
  .swal2-container{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  @media print{.bl-ov,.swal2-container{display:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="lg" id="logo">โล</span><span id="schoolName">บ้านละลม</span></div>
    <div class="user"><span id="userName">—</span><button class="btn-logout" id="logoutBtn"><i class="ti ti-logout" aria-hidden="true"></i> ออกจากระบบ</button></div>
  </header>
  <nav class="nav" id="nav"></nav>

  <main>
    <a class="back" href="points.html"><i class="ti ti-arrow-left" aria-hidden="true"></i> กลับหน้าแต้มสะสม</a>
    <h1>สรุปคะแนนรายคน</h1>
    <div class="sub">คะแนนงานที่ตรวจแล้ว และแต้มสะสมของนักเรียนรายบุคคล</div>

    <div class="picker">
      <select id="roomSel"><option value="">— เลือกห้อง —</option></select>
      <select id="studentSel"><option value="">— เลือกนักเรียน —</option></select>
    </div>

    <div id="content"></div>
  </main>

  <footer>ผู้พัฒนา: <b>นายชิติพัทธ์ นิลวรรณ</b><br>ครูโรงเรียนบ้านละลม สพป.ศรีสะเกษ เขต 3</footer>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwCTrn5F2tZ-UJiBazA1PA2np5Lwwhy_TYYie7liGg9LFIcaavqF78PLiPqaC3TwyXt/exec';

  const token = sessionStorage.getItem('bl_token');
  const session = JSON.parse(sessionStorage.getItem('bl_session') || 'null');
  if (!token || !session) { location.replace('login.html'); }

  async function api(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action, token: token }, payload || {}))
    });
    return res.json();
  }

  /* ===== ระบบกลาง: โลโก้ + ตัวโหลด + กล่องข้อความ (SweetAlert) ===== */
  const BL_LOGO = 'https://lh3.googleusercontent.com/d/1SpX1QE5ajLN-NiJmDuSkEjf5ith4Db5n';

  // ใส่โลโก้ลงหัวเว็บ พร้อมสำรองอัตโนมัติหากรูปโหลดไม่ขึ้น
  function setLogo(url) {
    const box = document.getElementById('logo');
    if (!box) return;
    const img = document.createElement('img');
    img.alt = ''; img.referrerPolicy = 'no-referrer';
    let tried = false;
    img.onerror = function () {
      // รูปจากค่าตั้งค่าโหลดไม่ขึ้น -> ถอยมาใช้โลโก้หลัก -> ถ้ายังไม่ขึ้นค่อยใช้ตัวอักษร
      if (!tried && img.src !== BL_LOGO) { tried = true; img.src = BL_LOGO; return; }
      box.textContent = 'โล';
    };
    img.src = url || BL_LOGO;
    box.textContent = ''; box.appendChild(img);
  }

  // ---- ตัวโหลด (พื้นหลังเบลอ + วงแหวนไซไฟ + โลโก้ตรงกลาง) ----
  let _blPending = 0, _blTimer = null, _blOv = null;
  function blOverlay() {
    if (_blOv) return _blOv;
    const d = document.createElement('div');
    d.className = 'bl-ov';
    d.innerHTML =
      '<div class="bl-ring"><svg viewBox="0 0 132 132" aria-hidden="true"><defs>' +
      '<linearGradient id="blgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A6E06B"/><stop offset="100%" stop-color="#5E9A2D"/></linearGradient>' +
      '<linearGradient id="blgB" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7C948"/><stop offset="100%" stop-color="#A6E06B"/></linearGradient></defs>' +
      '<circle cx="66" cy="66" r="62" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>' +
      '<circle class="r-out" cx="66" cy="66" r="62" fill="none" stroke="url(#blgA)" stroke-width="3" stroke-linecap="round" stroke-dasharray="72 318"/>' +
      '<circle cx="66" cy="66" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1"/>' +
      '<circle class="r-mid" cx="66" cy="66" r="50" fill="none" stroke="url(#blgB)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 272"/>' +
      '<circle class="r-dot" cx="66" cy="4" r="3.2" fill="#F7C948"/></svg>' +
      '<div class="bl-core"><img id="blLoaderLogo" alt=""></div></div>' +
      '<div class="bl-text" id="blLoaderText">กำลังโหลดข้อมูล<small>กรุณารอสักครู่</small></div>';
    document.body.appendChild(d);
    const li = d.querySelector('#blLoaderLogo');
    li.referrerPolicy = 'no-referrer';
    li.onerror = function () { li.style.display = 'none'; };
    li.src = BL_LOGO;
    _blOv = d; return d;
  }
  function blShowLoader(msg) {
    const d = blOverlay();
    if (msg) d.querySelector('#blLoaderText').innerHTML = msg + '<small>กรุณารอสักครู่</small>';
    d.classList.add('show');
  }
  function blHideLoader() { if (_blOv) _blOv.classList.remove('show'); }
  // แสดงเฉพาะเมื่อรอเกิน 280ms — คำสั่งที่เร็วจะไม่กระพริบรบกวนสายตา
  function blBegin() { _blPending++; if (_blPending === 1) _blTimer = setTimeout(function () { blShowLoader(); }, 280); }
  function blEnd() { _blPending = Math.max(0, _blPending - 1); if (_blPending === 0) { clearTimeout(_blTimer); blHideLoader(); } }

  // ---- กล่องข้อความ (ใช้ SweetAlert ถ้าโหลดได้ ไม่งั้นใช้ของเบราว์เซอร์) ----
  async function blConfirm(title, html, okText) {
    if (typeof Swal === 'undefined') return confirm(title + (html ? '\n\n' + String(html).replace(/<[^>]+>/g, ' ') : ''));
    const r = await Swal.fire({
      title: title, html: html || '', icon: 'warning', showCancelButton: true, reverseButtons: true,
      confirmButtonText: okText || 'ยืนยัน', cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#C0392B', cancelButtonColor: '#7E8B66'
    });
    return !!r.isConfirmed;
  }
  function blAlert(title, html, icon) {
    if (typeof Swal === 'undefined') { alert(title + (html ? '\n' + String(html).replace(/<[^>]+>/g, ' ') : '')); return; }
    Swal.fire({ title: title, html: html || '', icon: icon || 'info', confirmButtonColor: '#5E9A2D', confirmButtonText: 'ตกลง' });
  }
  function blToast(title, icon) {
    if (typeof Swal === 'undefined') return;
    Swal.fire({ toast: true, position: 'top-end', timer: 2200, showConfirmButton: false, title: title, icon: icon || 'success' });
  }

  // ครอบ api() ให้ขึ้นตัวโหลดอัตโนมัติทุกครั้งที่เรียกข้อมูล
  (function () {
    const _orig = api;
    api = async function (action, payload) {
      blBegin();
      try { return await _orig(action, payload); }
      finally { blEnd(); }
    };
  })();

  setLogo(); // แสดงโลโก้ทันที ไม่ต้องรอโหลดค่าจากเซิร์ฟเวอร์
  const $ = function (id) { return document.getElementById(id); };
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  const NAV = [
    { h: 'admin-dashboard.html', l: 'ภาพรวม', i: 'ti-chart-bar' }, { h: 'scan.html', l: 'สแกนรับงาน', i: 'ti-qrcode' },
    { h: 'assignments.html', l: 'งานที่มอบหมาย', i: 'ti-clipboard-list' }, { h: 'review.html', l: 'ตรวจงาน', i: 'ti-checkbox' }, { h: 'student-scores.html', l: 'คะแนนงาน', i: 'ti-report-analytics' },
    { h: 'points.html', l: 'แต้มสะสม', i: 'ti-trophy' }, { h: 'qrcard.html', l: 'สร้าง QR', i: 'ti-id-badge-2' },
    { h: 'students.html', l: 'นักเรียน', i: 'ti-user' }, { h: 'subjects.html', l: 'วิชา', i: 'ti-book' },
    { h: 'teachers.html', l: 'ครูผู้สอน', i: 'ti-users', admin: true }, { h: 'reports.html', l: 'รายงาน', i: 'ti-file-text' },
    { h: 'settings.html', l: 'ตั้งค่า', i: 'ti-settings', admin: true }
  ];
  (function renderNav() {
    const role = (session && session.role) || 'teacher';
    NAV.forEach(function (it) {
      if (it.admin && role !== 'admin') return;
      const a = document.createElement('a'); a.href = it.h;
      a.innerHTML = '<i class="ti ' + it.i + '" aria-hidden="true"></i> ' + it.l;
      if (it.h === 'points.html') a.className = 'active';
      $('nav').appendChild(a);
    });
  })();
  if (session) $('userName').textContent = session.name || 'ผู้ใช้';

  $('logoutBtn').addEventListener('click', async function () {
    try { await api('logout'); } catch (e) {}
    sessionStorage.removeItem('bl_token'); sessionStorage.removeItem('bl_session');
    location.replace('login.html');
  });

  (async function () {
    try {
      const c = await api('getConfig');
      if (c && c.ok) {
        if (c.schoolName) $('schoolName').textContent = c.schoolName;
        setLogo(c.logoUrl);
      }
    } catch (e) {}
  })();

  // โหลดนักเรียน (ตามสิทธิ์ครู) สำหรับตัวเลือก
  let allStudents = [];
  (async function loadStudents() {
    try {
      const r = await api('listStudents');
      if (r && r.ok) {
        allStudents = r.students;
        const rooms = {};
        allStudents.forEach(function (s) { rooms[s.roomLabel] = true; });
        Object.keys(rooms).sort().forEach(function (rl) {
          const o = document.createElement('option'); o.value = rl; o.textContent = 'ห้อง ' + rl; $('roomSel').appendChild(o);
        });
      }
    } catch (e) {}
    // ถ้ามี id ใน query string ให้โหลดเลย
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (id) { preselect(id); }
  })();

  function preselect(studentId) {
    const st = allStudents.filter(function (s) { return s.studentId === studentId; })[0];
    if (st) {
      $('roomSel').value = st.roomLabel;
      fillStudents(st.roomLabel);
      $('studentSel').value = studentId;
    }
    loadSummary(studentId);
  }

  $('roomSel').addEventListener('change', function () {
    fillStudents(this.value);
    $('content').innerHTML = '';
  });
  $('studentSel').addEventListener('change', function () { if (this.value) loadSummary(this.value); });

  function fillStudents(roomLabel) {
    const sel = $('studentSel'); sel.innerHTML = '<option value="">— เลือกนักเรียน —</option>';
    allStudents.filter(function (s) { return !roomLabel || s.roomLabel === roomLabel; })
      .sort(function (a, b) { return (Number(a.seatNo) || 0) - (Number(b.seatNo) || 0); })
      .forEach(function (s) {
        const o = document.createElement('option'); o.value = s.studentId;
        o.textContent = 'เลขที่ ' + s.seatNo + ' · ' + s.name; sel.appendChild(o);
      });
  }

  async function loadSummary(studentId) {
    $('content').innerHTML = '<div class="empty">กำลังโหลด...</div>';
    try {
      const r = await api('getScoreSummary', { studentId: studentId });
      if (!r || !r.ok) { $('content').innerHTML = '<div class="empty">' + ((r && r.error) || 'โหลดข้อมูลไม่สำเร็จ') + '</div>'; return; }
      render(r);
    } catch (e) { $('content').innerHTML = '<div class="empty">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้</div>'; }
  }

  function render(r) {
    const st = r.student, t = r.totals;
    const initial = (st.name || '?').replace(/^(เด็กชาย|เด็กหญิง|นาย|นางสาว|นาง|ด\.ช\.|ด\.ญ\.)/, '').trim().charAt(0) || '?';
    let html =
      '<div class="head-card"><div class="avatar">' + escapeHtml(initial) + '</div>' +
        '<div class="info"><div class="nm">' + escapeHtml(st.name) + '</div>' +
        '<div class="rm">เลขที่ ' + escapeHtml(st.seatNo) + ' · ' + escapeHtml(st.roomLabel) + '</div></div>' +
        '<div class="totals">' +
          '<div class="tchip"><b>' + t.points + '</b><span>แต้มสะสม</span></div>' +
          '<div class="tchip"><b>' + t.score + (t.max ? '/' + t.max : '') + '</b><span>คะแนนรวม</span></div>' +
          '<div class="tchip"><b>' + t.count + '</b><span>งานที่ส่ง</span></div>' +
        '</div>' +
        '<button class="printbtn" onclick="window.print()"><i class="ti ti-printer"></i> พิมพ์</button>' +
      '</div>';

    if (!r.items.length) {
      html += '<div class="panel"><div class="empty">ยังไม่มีการส่งงาน</div></div>';
    } else {
      html += '<div class="panel"><table><thead><tr><th>วิชา</th><th>งาน</th><th style="width:96px">การส่ง</th><th style="width:90px">คะแนน</th><th style="width:70px">แต้ม</th></tr></thead><tbody>';
      r.items.forEach(function (it) {
        const tl = (it.timeliness === 'สาย') ? '<span class="pill p-late">สาย</span>' : '<span class="pill p-ok">ตรงเวลา</span>';
        const ck = (it.status === 'ตรวจแล้ว') ? ' <span class="pill p-ck">ตรวจแล้ว</span>' : '';
        const sc = (it.score != null) ? (it.score + (it.maxScore != null ? '/' + it.maxScore : '')) : '<span style="color:#B6BBA6">-</span>';
        html += '<tr><td>' + escapeHtml(it.subjectName) + '</td><td>' + escapeHtml(it.title) + '</td>' +
          '<td>' + tl + ck + '</td><td class="scorecell">' + sc + '</td><td>' + it.points + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    $('content').innerHTML = html;
  }
</script>
</body>
</html>
