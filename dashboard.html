<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายงานการส่งงาน · ระบบส่งงานบ้านละลม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--green:#5E9A2D;--green-d:#2F5511;--green-l:#EFF4E4;--yellow:#F7C948;--yellow-d:#6B4D06;--grey:#B4B2A9;--bg:#F4F8EC;--ink:#33421C;--muted:#6E7B56;--line:#D2DEBC;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans Thai',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--green);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:600}
  .brand .lg{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:16px;font-weight:700;flex:none}
  .brand .lg img{width:100%;height:100%;object-fit:contain}
  .btn-login{background:var(--yellow);color:var(--yellow-d);border:none;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-login:hover{filter:brightness(1.05)}
  main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:18px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:21px;font-weight:600;color:var(--green-d)} .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .datebox{display:flex;align-items:center;gap:8px}
  input[type=date]{height:42px;border:0.5px solid #CBD9B0;border-radius:10px;padding:0 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  input[type=date]:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(94,154,45,.2)}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
  @media(max-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}}
  .metric{background:#fff;border:0.5px solid var(--line);border-radius:12px;padding:14px 16px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .reveal{animation:rise .5s cubic-bezier(.22,.61,.36,1) both}
  @media(prefers-reduced-motion:reduce){.reveal{animation:none}}
  .metric .lab{font-size:12px;color:var(--muted)} .metric .num{font-size:26px;font-weight:600;color:var(--green-d);margin-top:3px}
  .card{background:#fff;border:0.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px}
  .ctitle{font-size:14px;font-weight:600;color:var(--green-d);margin-bottom:12px}
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:720px){.charts{grid-template-columns:1fr}}
  .chartwrap{position:relative;height:230px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
  .lg-item{display:flex;align-items:center;gap:7px;color:var(--muted)} .sw{width:11px;height:11px;border-radius:3px}
  .arow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:0.5px solid #EDF1E2}
  .arow:last-child{border-bottom:none}
  .arow .info{flex:1;min-width:0}
  .arow .t{font-size:14px;color:var(--ink)} .arow .track{height:8px;border-radius:5px;background:#EAEFE0;overflow:hidden;margin-top:7px}
  .arow .fill{height:100%;background:var(--green);border-radius:5px;transition:width .5s ease}
  .arow .n{font-size:13px;color:var(--muted);width:88px;text-align:right;flex:none}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 10px}
  .loading{color:var(--muted);font-size:14px;text-align:center;padding:40px 10px}
  footer{margin-top:20px;padding:16px;border-top:0.5px solid var(--line);background:var(--green-l);font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
  footer b{color:var(--green-d);font-weight:600}
</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.21.0/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <style>
  /* ===== ตัวโหลดข้อมูล ธีมไซไฟ (พื้นหลังเบลอ + วงแหวน + โลโก้กลาง) ===== */
  .bl-ov{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    background:rgba(18,30,10,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;transition:opacity .22s ease}
  .bl-ov.show{display:flex;opacity:1}
  .bl-ring{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center}
  .bl-ring svg{position:absolute;top:0;left:0;width:132px;height:132px}
  .bl-ring .r-out,.bl-ring .r-mid,.bl-ring .r-dot{transform-box:view-box;transform-origin:50% 50%}
  .bl-ring .r-out{animation:bl-cw 2.6s linear infinite}
  .bl-ring .r-mid{animation:bl-ccw 1.7s linear infinite}
  .bl-ring .r-dot{animation:bl-cw 1.1s linear infinite}
  @keyframes bl-cw{to{transform:rotate(360deg)}}
  @keyframes bl-ccw{to{transform:rotate(-360deg)}}
  .bl-core{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;
    overflow:hidden;animation:bl-pulse 1.9s ease-in-out infinite}
  .bl-core img{width:78%;height:78%;object-fit:contain}
  @keyframes bl-pulse{0%,100%{box-shadow:0 0 20px rgba(94,154,45,.5)}50%{box-shadow:0 0 38px rgba(247,201,72,.62)}}
  .bl-text{color:#fff;font-family:'IBM Plex Sans Thai',sans-serif;font-size:14.5px;font-weight:500;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.55)}
  .bl-text small{display:block;font-size:11.5px;opacity:.78;font-weight:400;margin-top:4px}
  @media(prefers-reduced-motion:reduce){.bl-ring .r-out,.bl-ring .r-mid,.bl-ring .r-dot,.bl-core{animation:none}}
  .swal2-popup{font-family:'IBM Plex Sans Thai',sans-serif!important}
  .swal2-container{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  @media print{.bl-ov,.swal2-container{display:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="lg" id="logo">โล</span><span id="schoolName">ระบบส่งงาน · บ้านละลม</span></div>
    <a class="btn-login" href="login.html"><i class="ti ti-login-2" aria-hidden="true"></i> เข้าสู่ระบบ</a>
  </header>

  <main>
    <div class="top">
      <div><h1>รายงานการส่งงานรายวัน</h1><div class="sub" id="dateSub">ภาพรวมของวันนี้</div></div>
      <div class="datebox"><span class="sub">วันที่:</span><input type="date" id="datePick"></div>
    </div>

    <div id="content">
      <div class="loading" id="loading">กำลังโหลดข้อมูล...</div>
    </div>
  </main>

  <footer>ผู้พัฒนา: <b>นายชิติพัทธ์ นิลวรรณ</b><br>ครูโรงเรียนบ้านละลม สพป.ศรีสะเกษ เขต 3</footer>

<script>
  // ====== วาง URL /exec ของ Web App ที่ deploy จาก Code.gs ตรงนี้ ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbwCTrn5F2tZ-UJiBazA1PA2np5Lwwhy_TYYie7liGg9LFIcaavqF78PLiPqaC3TwyXt/exec';

  async function api(action, payload) {
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: action }, payload || {}))
    });
    return res.json();
  }

  /* ===== ระบบกลาง: โลโก้ + ตัวโหลด + กล่องข้อความ (SweetAlert) ===== */
  const BL_LOGO = 'https://lh3.googleusercontent.com/d/1SpX1QE5ajLN-NiJmDuSkEjf5ith4Db5n';

  // ใส่โลโก้ลงหัวเว็บ พร้อมสำรองอัตโนมัติหากรูปโหลดไม่ขึ้น
  function setLogo(url) {
    const box = document.getElementById('logo');
    if (!box) return;
    const img = document.createElement('img');
    img.alt = ''; img.referrerPolicy = 'no-referrer';
    let tried = false;
    img.onerror = function () {
      // รูปจากค่าตั้งค่าโหลดไม่ขึ้น -> ถอยมาใช้โลโก้หลัก -> ถ้ายังไม่ขึ้นค่อยใช้ตัวอักษร
      if (!tried && img.src !== BL_LOGO) { tried = true; img.src = BL_LOGO; return; }
      box.textContent = 'โล';
    };
    img.src = url || BL_LOGO;
    box.textContent = ''; box.appendChild(img);
  }

  // ---- ตัวโหลด (พื้นหลังเบลอ + วงแหวนไซไฟ + โลโก้ตรงกลาง) ----
  let _blPending = 0, _blTimer = null, _blOv = null;
  function blOverlay() {
    if (_blOv) return _blOv;
    const d = document.createElement('div');
    d.className = 'bl-ov';
    d.innerHTML =
      '<div class="bl-ring"><svg viewBox="0 0 132 132" aria-hidden="true"><defs>' +
      '<linearGradient id="blgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#A6E06B"/><stop offset="100%" stop-color="#5E9A2D"/></linearGradient>' +
      '<linearGradient id="blgB" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F7C948"/><stop offset="100%" stop-color="#A6E06B"/></linearGradient></defs>' +
      '<circle cx="66" cy="66" r="62" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.5"/>' +
      '<circle class="r-out" cx="66" cy="66" r="62" fill="none" stroke="url(#blgA)" stroke-width="3" stroke-linecap="round" stroke-dasharray="72 318"/>' +
      '<circle cx="66" cy="66" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1"/>' +
      '<circle class="r-mid" cx="66" cy="66" r="50" fill="none" stroke="url(#blgB)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="42 272"/>' +
      '<circle class="r-dot" cx="66" cy="4" r="3.2" fill="#F7C948"/></svg>' +
      '<div class="bl-core"><img id="blLoaderLogo" alt=""></div></div>' +
      '<div class="bl-text" id="blLoaderText">กำลังโหลดข้อมูล<small>กรุณารอสักครู่</small></div>';
    document.body.appendChild(d);
    const li = d.querySelector('#blLoaderLogo');
    li.referrerPolicy = 'no-referrer';
    li.onerror = function () { li.style.display = 'none'; };
    li.src = BL_LOGO;
    _blOv = d; return d;
  }
  function blShowLoader(msg) {
    const d = blOverlay();
    if (msg) d.querySelector('#blLoaderText').innerHTML = msg + '<small>กรุณารอสักครู่</small>';
    d.classList.add('show');
  }
  function blHideLoader() { if (_blOv) _blOv.classList.remove('show'); }
  // แสดงเฉพาะเมื่อรอเกิน 280ms — คำสั่งที่เร็วจะไม่กระพริบรบกวนสายตา
  function blBegin() { _blPending++; if (_blPending === 1) _blTimer = setTimeout(function () { blShowLoader(); }, 280); }
  function blEnd() { _blPending = Math.max(0, _blPending - 1); if (_blPending === 0) { clearTimeout(_blTimer); blHideLoader(); } }

  // ---- กล่องข้อความ (ใช้ SweetAlert ถ้าโหลดได้ ไม่งั้นใช้ของเบราว์เซอร์) ----
  async function blConfirm(title, html, okText) {
    if (typeof Swal === 'undefined') return confirm(title + (html ? '\n\n' + String(html).replace(/<[^>]+>/g, ' ') : ''));
    const r = await Swal.fire({
      title: title, html: html || '', icon: 'warning', showCancelButton: true, reverseButtons: true,
      confirmButtonText: okText || 'ยืนยัน', cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#C0392B', cancelButtonColor: '#7E8B66'
    });
    return !!r.isConfirmed;
  }
  function blAlert(title, html, icon) {
    if (typeof Swal === 'undefined') { alert(title + (html ? '\n' + String(html).replace(/<[^>]+>/g, ' ') : '')); return; }
    Swal.fire({ title: title, html: html || '', icon: icon || 'info', confirmButtonColor: '#5E9A2D', confirmButtonText: 'ตกลง' });
  }
  function blToast(title, icon) {
    if (typeof Swal === 'undefined') return;
    Swal.fire({ toast: true, position: 'top-end', timer: 2200, showConfirmButton: false, title: title, icon: icon || 'success' });
  }

  // ครอบ api() ให้ขึ้นตัวโหลดอัตโนมัติทุกครั้งที่เรียกข้อมูล
  (function () {
    const _orig = api;
    api = async function (action, payload) {
      blBegin();
      try { return await _orig(action, payload); }
      finally { blEnd(); }
    };
  })();

  setLogo(); // แสดงโลโก้ทันที ไม่ต้องรอโหลดค่าจากเซิร์ฟเวอร์
  const $ = function (id) { return document.getElementById(id); };
  function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  (async function () {
    try {
      const c = await api('getConfig');
      if (c && c.ok) {
        if (c.schoolName) $('schoolName').textContent = 'ระบบส่งงาน · ' + c.schoolName;
        setLogo(c.logoUrl);
      }
    } catch (e) {}
  })();

  function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  let donutChart = null, barChart = null;

  $('datePick').value = todayStr();
  $('datePick').addEventListener('change', function () { load(this.value); });

  load(todayStr());

  async function load(dateStr) {
    $('content').innerHTML = '<div class="loading">กำลังโหลดข้อมูล...</div>';
    try {
      const r = await api('getPublicDashboard', { date: dateStr });
      if (!r || !r.ok) { $('content').innerHTML = '<div class="empty">ไม่สามารถโหลดข้อมูลได้</div>'; return; }
      renderDashboard(r);
    } catch (e) {
      $('content').innerHTML = '<div class="empty">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบ API_URL</div>';
    }
  }

  function renderDashboard(d) {
    const s = d.summary || { submitted: 0, late: 0, pending: 0, total: 0, rate: 0 };
    const onTime = Math.max(0, s.submitted - s.late);
    const isToday = d.date === todayStr();
    $('dateSub').textContent = isToday ? 'ภาพรวมของวันนี้' : 'ภาพรวมของวันที่ ' + d.date;

    $('content').innerHTML =
      '<div class="grid4">' +
        metric('ส่งตรงเวลา', onTime, 'var(--green-d)', 0) +
        metric('ส่งสาย', s.late, 'var(--yellow-d)', 1) +
        metric('ยังไม่ส่ง', s.pending, '#5F5E5A', 2) +
        metric('อัตราการส่ง', s.rate, 'var(--green-d)', 3, '%') +
      '</div>' +
      '<div class="card reveal" style="animation-delay:.18s"><div class="ctitle">สถิติการส่งงาน</div>' +
        '<div class="charts">' +
          '<div><div class="chartwrap"><canvas id="donut"></canvas></div>' +
            '<div class="legend">' +
              legend('var(--green)', 'ส่งตรงเวลา · ' + onTime) +
              legend('var(--yellow)', 'ส่งสาย · ' + s.late) +
              legend('var(--grey)', 'ยังไม่ส่ง · ' + s.pending) +
            '</div></div>' +
          '<div><div class="sub" style="margin-bottom:6px">อัตราการส่ง 5 วันล่าสุด (%)</div><div class="chartwrap"><canvas id="bar"></canvas></div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card reveal" style="animation-delay:.26s"><div class="ctitle">งานที่ครบกำหนด' + (isToday ? 'วันนี้' : 'วันที่ ' + d.date) + '</div><div id="alist"></div></div>';

    runCountUps();
    renderAssignments(d.assignments || []);
    drawDonut(onTime, s.late, s.pending);
    drawBar(d.trend || []);
  }

  function metric(lab, num, color, idx, suffix) {
    return '<div class="metric reveal" style="animation-delay:' + (idx * 0.06) + 's">' +
      '<div class="lab">' + lab + '</div>' +
      '<div class="num" style="color:' + color + '" data-target="' + num + '" data-suffix="' + (suffix || '') + '">0' + (suffix || '') + '</div></div>';
  }

  // ตัวเลขวิ่งขึ้นจาก 0 ไปหาค่าจริง
  function runCountUps() {
    const els = document.querySelectorAll('.num[data-target]');
    els.forEach(function (el) {
      const target = Number(el.getAttribute('data-target')) || 0;
      const suffix = el.getAttribute('data-suffix') || '';
      if (target === 0) { el.textContent = '0' + suffix; return; }
      const dur = 900, start = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3); // ease-out
        el.textContent = Math.round(target * eased) + suffix;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target + suffix;
      }
      requestAnimationFrame(tick);
    });
  }

  function legend(color, text) { return '<span class="lg-item"><span class="sw" style="background:' + color + '"></span>' + escapeHtml(text) + '</span>'; }

  function renderAssignments(list) {
    const box = $('alist');
    if (!list.length) { box.innerHTML = '<div class="empty">ไม่มีงานที่ครบกำหนดในวันนี้</div>'; return; }
    box.innerHTML = '';
    list.forEach(function (a, i) {
      const div = document.createElement('div'); div.className = 'arow reveal';
      div.style.animationDelay = (0.3 + i * 0.07) + 's';
      div.innerHTML =
        '<div class="info"><div class="t">' + escapeHtml(a.subjectName) + ' ' + escapeHtml(a.roomLabel) + ' · ' + escapeHtml(a.title) + '</div>' +
        '<div class="track"><div class="fill" style="width:0%"></div></div></div>' +
        '<div class="n">' + a.submitted + '/' + a.expected + ' คน</div>';
      box.appendChild(div);
      // แถบวิ่งขยายจาก 0 ไปหาเปอร์เซ็นต์จริง (หน่วงให้เริ่มหลังการ์ดโผล่)
      const fill = div.querySelector('.fill');
      setTimeout(function () { fill.style.width = a.percent + '%'; }, 450 + i * 70);
    });
  }

  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function drawDonut(onTime, late, pending) {
    if (typeof Chart === 'undefined') return;
    const ctx = $('donut'); if (!ctx) return;
    if (donutChart) donutChart.destroy();
    const total = onTime + late + pending;
    const empty = (total === 0);

    // ปลั๊กอินวาดข้อความตรงกลางวงโดนัท
    const centerText = {
      id: 'centerText',
      afterDraw: function (chart) {
        const c2 = chart.ctx; const area = chart.chartArea;
        if (!area) return;
        const cx = (area.left + area.right) / 2, cy = (area.top + area.bottom) / 2;
        c2.save(); c2.textAlign = 'center'; c2.textBaseline = 'middle';
        if (empty) {
          c2.font = '600 15px "IBM Plex Sans Thai", sans-serif';
          c2.fillStyle = cssVar('--muted') || '#6E7B56';
          c2.fillText('ยังไม่มีข้อมูล', cx, cy - 8);
          c2.font = '400 12px "IBM Plex Sans Thai", sans-serif';
          c2.fillText('วันนี้', cx, cy + 12);
        } else {
          const pct = Math.round(onTime / total * 100);
          c2.font = '700 26px "IBM Plex Sans Thai", sans-serif';
          c2.fillStyle = cssVar('--green-d') || '#2F5511';
          c2.fillText(pct + '%', cx, cy - 6);
          c2.font = '400 12px "IBM Plex Sans Thai", sans-serif';
          c2.fillStyle = cssVar('--muted') || '#6E7B56';
          c2.fillText('ตรงเวลา', cx, cy + 16);
        }
        c2.restore();
      }
    };

    donutChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: empty ? ['ยังไม่มีข้อมูล'] : ['ส่งตรงเวลา', 'ส่งสาย', 'ยังไม่ส่ง'],
        datasets: [{
          data: empty ? [1] : [onTime, late, pending],
          backgroundColor: empty ? ['#EAEFE0'] : [cssVar('--green'), cssVar('--yellow'), cssVar('--grey')],
          borderWidth: 2, borderColor: '#fff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '64%',
        plugins: {
          legend: { display: false },
          tooltip: { enabled: !empty, callbacks: { label: function (c) { const pct = total ? Math.round(c.parsed / total * 100) : 0; return c.label + ': ' + c.parsed + ' คน (' + pct + '%)'; } } }
        }
      },
      plugins: [centerText]
    });
  }

  function drawBar(trend) {
    if (typeof Chart === 'undefined') return;
    const ctx = $('bar'); if (!ctx) return;
    if (barChart) barChart.destroy();
    barChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: trend.map(function (t) { return t.label; }),
        datasets: [{ data: trend.map(function (t) { return t.percent; }), backgroundColor: cssVar('--green'), borderRadius: 6, maxBarThickness: 38 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 100, ticks: { callback: function (v) { return v + '%'; } }, grid: { color: '#EDF1E2' } }, x: { grid: { display: false } } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return c.parsed.y + '%'; } } } }
      }
    });
  }
</script>
</body>
</html>
